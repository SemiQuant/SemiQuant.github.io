skills:
  - id: computational
    label: Computational
    body: |-
      Languages: R, Python, Bash.
      Analysis: bioinformatics pipeline development (Nextflow, Snakemake-style workflows), genome assembly and variant calling, amplicon and whole-genome sequencing analysis, RNA-seq and differential expression, nanopore and Illumina data processing, interactive web applications (R Shiny, self-contained HTML/JavaScript).
  - id: statistics-and-ml
    label: Statistics & ML
    body: Descriptive statistics; regression and classification; survival analysis (Cox proportional hazards, Kaplan–Meier); genome-wide association studies; machine learning (support vector machines, XGBoost, random forests, boosted trees); population genetics; graph theory.
  - id: laboratory
    label: Laboratory
    body: Biosafety Level 3 certified. Mycobacterial, bacterial, and yeast cell culture; DNA, RNA, and plasmid isolation (manual methods); PCR, qPCR, digital PCR, and RT-PCR; sequencing library preparation (Illumina, Oxford Nanopore); cloning; protein expression; PAGE; Southern and Western blotting; confocal and scanning electron microscopy.
  - id: engineering
    label: Engineering
    body: "Instrument prototyping: 3D printing, CNC machining, laser cutting, PCB design and soldering, embedded firmware. Adobe Illustrator and Photoshop."

