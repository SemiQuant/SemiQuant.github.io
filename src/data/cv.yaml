# CV sections. Generated from the CV by scripts/extract-cv.mjs. Edit the CV, then re-run.

experience:
  - id: ucsf
    role: Assistant Researcher / Postdoctoral Researcher
    org: Division of Pulmonary and Critical Care Medicine, University of California, San Francisco
    place: San Francisco, USA
    start: 10/2019
    end: present
    points:
      - Designed and built turboLysis end to end, from mechanics and PCB through firmware and lysis chemistry, and released it as open hardware; the work won follow-on Gates Grand Challenges funding for an automated, battery-powered second build now in validation against commercial bead beating.
      - Wrote the specific aims for the funded R01 behind XpertNano, moving extraction, amplification, UMI tagging, and nanopore library preparation into a GeneXpert cartridge; set the performance thresholds and go/no-go gates, and ran the technical negotiation with Cepheid, Oxford Nanopore, and FIND.
      - Developed and published six molecular methods (primerJinn, stilPCR, spotPCR, selSeq, URAdime, CountFU), each released as open-source software or an open protocol.
      - Build analysis tools in R and Python for colleagues who do not code, including browser-based versions requiring no installation; validated each rewrite against the original outputs before release.
  - id: uct-lung-institute
    role: Postdoctoral Researcher
    org: Centre for Lung Infection and Immunity, University of Cape Town
    place: Cape Town, South Africa
    start: 07/2017
    end: 09/2019
    points:
      - Led the bioinformatics group, building the genomic and transcriptomic pipelines used across the center’s TB projects.
      - Co-authored the analysis of cough aerosol culture positivity in drug-resistant versus drug-susceptible TB (Nature Medicine, 2020), establishing bacterial and host determinants of patient infectiousness.
      - Developed methods to recover and analyze the *M. tuberculosis* transcriptome directly from complex clinical samples.
      - Coordinated exchange programs, courses, and mentoring across the EDCTP-funded TESA network of African TB research sites.
