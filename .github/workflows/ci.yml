name: CI

on:
  pull_request:
  push:
    branches-ignore: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # pdftotext, so the guard can read PDFs under public/files.
      - name: Install poppler
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends poppler-utils

      - name: Type check
        run: npx astro check

      - name: Build
        run: npm run build

      - name: Route and privacy guard
        run: node scripts/guard.mjs --strict-pdf

      # The private CV is not in the repo, so the CV comparison is skipped here.
      - name: Content audit
        run: node scripts/audit-content.mjs

      - name: Copy lint
        run: node scripts/lint-copy.mjs

      - name: Internal links
        run: node scripts/check-links.mjs
